[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baitwatch"
version = "0.1.0"
description = "CNN models for fish detection and species identification in BRUVs video."
authors = [
    {name = "Aurelien Chagnon", email = "mra.chagnon@gmail.com"},
]
maintainers = [
    {name = "Aurelien Chagnon", email = "mra.chagnon@gmail.com"},
]
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
keywords = ["Deep Learning", "Computer Vision", "Fish Detection", "BRUV"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.135.1",
    "google-cloud-storage>=3.10.0",
    "invoke>=2.2.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
    "pillow>=12.1.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.22",
    "scikit-learn>=1.8.0",
    "uvicorn>=0.42.0",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.9.1",
  "torchvision>=0.24.1",
]
cu130 = [
  "torch>=2.9.1",
  "torchvision>=0.24.1",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu130" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.urls]
Homepage = "https://github.com/AurelienChagnon/baitwatch"
Repository = "https://github.com/AurelienChagnon/baitwatch.git"
Issues = "https://github.com/AurelienChagnon/baitwatch/issues"

[project.scripts]
baitwatch = "baitwatch.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "ruff>=0.15.9",
    "tensorflow>=2.21.0",
    "types-tensorflow>=2.18.0.20260402",
]
prod = [
    "tensorflow-cpu>=2.21.0",
]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
preview = true
select = [
    # pycodestyle
    "E",
    # warning pycodstyle
    "W",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-pytest-style
    "PT",
    # flake8-name
    "N",
    # flake8-annotations
    "ANN",
    # flake8-async
    "ASYNC",
    # flake8-pathlib
    "PTH",
    # flake8-arguments
    "ARG",
    # flake8-builtin
    "A",
    # flake8-print
    "T",
    # flake8-log-format
    "G",
    # pylint
    "PL",
    # Pydoclint
    "DOC",
    # pydocstyle
    "D",
    # RUFF
    "RUF",
    # Tryceratops
    "TRY",
    # bandit
    "S",
    # Perflint
    "PERF",
    # FastAPI
    "FAST",
    # Numpy
    "NPY",
    # Maccabe
    "C",
]
ignore = [
    # Allow Any type
    "ANN401",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 99

[tool.ruff.lint.pydocstyle]
convention = "google"
